<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相册 - Our Romantic Site</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>📸 我们的相册</h1>
    <p><a href="{{ url_for('index') }}" style="color:#d6336c;">← 返回首页</a></p>
  </header>

  <div class="container">
    <div class="gallery">
      {% for photo in photos %}
        <div class="card">
          <img src="{{ photo.url }}" alt="{{ photo.caption }}" onerror="this.src='https://via.placeholder.com/300x200?text=Photo'">
          <p>{{ photo.caption }}</p>
          <small>{{ photo.date }}</small>
        </div>
      {% else %}
        <p style="grid-column:1/-1;text-align:center;color:#a64d78;">相册还是空的</p>
      {% endfor %}
    </div>
  </div>
</body>
</html>
